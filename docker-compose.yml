# Every value below reads from the project-root .env file, with a working
# default after ":-". So `docker compose up` works on a fresh clone with no
# .env at all, and a teammate whose Postgres user, database name or host ports
# differ only has to edit .env — never this file.
#
# Note: Compose uses .env for ${...} substitution here, AND passes it into the
# backend/worker containers via `env_file:`. Both read the same file.

networks:
  tensornest_default:
    name: ${DOCKER_NETWORK:-tensornest_default}

volumes:
  postgres_data:
  minio_data:
  # Shared job workspace. Explicitly named (rather than letting Compose prefix
  # it with the project name) because the backend passes this exact name to the
  # host Docker daemon when it starts a sibling job container.
  tensornest_storage:
    name: ${STORAGE_VOLUME:-tensornest_storage}

services:
  # Not a running service — it exists so that `docker compose build` (and
  # `up --build`) produces the tensornest-kernel image on the host daemon.
  #
  # The backend launches notebook kernels as *sibling* containers through the
  # host's Docker socket, so the image has to exist on the host before a kernel
  # can start. Without this, the Docker SDK falls back to pulling
  # `tensornest-kernel:latest` from Docker Hub, which does not exist, and the
  # notebook fails with "Failed to reach kernel".
  #
  # `command: ["true"]` overrides the Dockerfile's CMD so the container exits
  # immediately after being built. Seeing it as "Exited (0)" is expected.
  kernel-image:
    build: ./kernel-image
    image: ${KERNEL_IMAGE:-tensornest-kernel:latest}
    command: ["true"]
    restart: "no"
    networks: [tensornest_default]

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tensornest}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tensornest}
      POSTGRES_DB: ${POSTGRES_DB:-tensornest}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    networks: [tensornest_default]
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tensornest} -d ${POSTGRES_DB:-tensornest}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6380}:6379"
    networks: [tensornest_default]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Optional local stand-in for Cloudflare R2, for working offline. Same S3
  # API, so the backend code is identical either way — only the endpoint and
  # keys change.
  #
  # Not started by default, because the normal setup points S3_* at R2 in .env.
  # To use it instead:  comment out the S3_* block in .env, then
  #   docker compose --profile local-storage up -d
  #
  # Image comes from MinIO's own registry: Docker Hub no longer serves a
  # `minio/minio:latest` tag, so the docker.io reference fails to pull.
  minio:
    profiles: ["local-storage"]
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-tensornest}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-tensornest123}
    volumes:
      - minio_data:/data
    ports:
      - "${MINIO_API_PORT:-9000}:9000"       # S3 API
      - "${MINIO_CONSOLE_PORT:-9001}:9001"   # web console
    networks: [tensornest_default]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    env_file: .env
    environment:
      # Built from the three POSTGRES_* values so the app and the database
      # container can never disagree about user, password or database name.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-tensornest}:${POSTGRES_PASSWORD:-tensornest}@postgres:5432/${POSTGRES_DB:-tensornest}
      # Service names and in-container paths, not host values — these are fixed
      # by the compose network and the volume mount below.
      REDIS_URL: redis://redis:6379/0
      STORAGE_ROOT: /storage
      DOCKER_NETWORK: ${DOCKER_NETWORK:-tensornest_default}
      # Falls back to the local MinIO bucket whenever .env leaves these unset.
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
      # Endpoint that presigned download URLs are signed against, i.e. one the
      # browser can reach. Defaults to the R2 endpoint when S3_ENDPOINT_URL is
      # set, and to the host-published MinIO port otherwise.
      S3_PUBLIC_ENDPOINT_URL: ${S3_PUBLIC_ENDPOINT_URL:-${S3_ENDPOINT_URL:-http://localhost:${MINIO_API_PORT:-9000}}}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-tensornest}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-tensornest123}
      S3_BUCKET: ${S3_BUCKET:-tensornest}
      S3_REGION: ${S3_REGION:-auto}
    volumes:
      - tensornest_storage:/storage
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # The backend creates the bucket on startup and exits if storage is
      # unreachable, so it must not boot before MinIO is serving. `required:
      # false` keeps this a no-op when the local-storage profile is off and
      # S3_* points at Cloudflare R2 instead.
      minio:
        condition: service_healthy
        required: false
    networks: [tensornest_default]

  worker:
    build: ./backend
    command: ["arq", "app.workers.worker_settings.WorkerSettings"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-tensornest}:${POSTGRES_PASSWORD:-tensornest}@postgres:5432/${POSTGRES_DB:-tensornest}
      REDIS_URL: redis://redis:6379/0
      STORAGE_ROOT: /storage
      DOCKER_NETWORK: ${DOCKER_NETWORK:-tensornest_default}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
      # Endpoint that presigned download URLs are signed against, i.e. one the
      # browser can reach. Defaults to the R2 endpoint when S3_ENDPOINT_URL is
      # set, and to the host-published MinIO port otherwise.
      S3_PUBLIC_ENDPOINT_URL: ${S3_PUBLIC_ENDPOINT_URL:-${S3_ENDPOINT_URL:-http://localhost:${MINIO_API_PORT:-9000}}}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-tensornest}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-tensornest123}
      S3_BUCKET: ${S3_BUCKET:-tensornest}
      S3_REGION: ${S3_REGION:-auto}
    volumes:
      - tensornest_storage:/storage
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # The backend creates the bucket on startup and exits if storage is
      # unreachable, so it must not boot before MinIO is serving. `required:
      # false` keeps this a no-op when the local-storage profile is off and
      # S3_* points at Cloudflare R2 instead.
      minio:
        condition: service_healthy
        required: false
    networks: [tensornest_default]

  frontend:
    build: ./frontend
    environment:
      # Read by the browser, so it must be a URL the *host* can reach — hence
      # localhost and BACKEND_PORT rather than the `backend` service name.
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend
    networks: [tensornest_default]
